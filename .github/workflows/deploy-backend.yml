name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            LOG_FILE="/tmp/deploy_debug.log"
            echo "Deployment Started at $(date)" > $LOG_FILE
            echo "Current User: $(whoami)" >> $LOG_FILE
            echo "Node path: $(which node 2>&1)" >> $LOG_FILE
            echo "PM2 path: $(which pm2 2>&1)" >> $LOG_FILE

            for dir in /var/www/cctv-project $HOME/CCTVWebsite /var/www/cctv-backend; do
              if [ -d "$dir" ]; then
                echo "Updating repository in $dir..." >> $LOG_FILE
                cd "$dir"
                git fetch origin main >> $LOG_FILE 2>&1
                git reset --hard origin/main >> $LOG_FILE 2>&1
                if [ -d "$dir/backend" ]; then
                  cd "$dir/backend"
                  npm install >> $LOG_FILE 2>&1
                  npm run build >> $LOG_FILE 2>&1
                  mkdir -p public/images
                  cp $LOG_FILE public/images/deploy-log.txt 2>/dev/null || true
                elif [ -f "$dir/package.json" ]; then
                  npm install >> $LOG_FILE 2>&1
                  npm run build >> $LOG_FILE 2>&1
                  mkdir -p public/images
                  cp $LOG_FILE public/images/deploy-log.txt 2>/dev/null || true
                fi
              fi
            done

            pm2 restart all >> $LOG_FILE 2>&1 || pm2 restart cctv-backend >> $LOG_FILE 2>&1 || pm2 restart backend >> $LOG_FILE 2>&1
            pm2 list >> $LOG_FILE 2>&1

            find /var/www $HOME -type d -name "images" 2>/dev/null | while read img_dir; do
              cp $LOG_FILE "$img_dir/deploy-log.txt" 2>/dev/null || true
            done

            # Ensure Nginx allows up to 50MB uploads
            sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
            sudo sed -i '/http {/a \    client_max_body_size 50M;' /etc/nginx/nginx.conf
            sudo nginx -t && sudo systemctl reload nginx || true
