name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/cctv-project
            git pull origin main
            cd backend
            npm install
            npm run build
            pm2 restart cctv-backend
            # Ensure Nginx allows up to 50MB uploads
            sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
            sudo sed -i '/http {/a \    client_max_body_size 50M;' /etc/nginx/nginx.conf
            sudo nginx -t && sudo systemctl reload nginx || true
