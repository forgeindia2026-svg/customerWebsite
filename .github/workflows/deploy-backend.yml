name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for dir in /var/www/cctv-project $HOME/CCTVWebsite; do
              if [ -d "$dir" ]; then
                echo "Updating repository in $dir..."
                cd "$dir"
                git fetch origin main
                git reset --hard origin/main
                if [ -d "$dir/backend" ]; then
                  cd "$dir/backend"
                  npm install
                  npm run build
                fi
              fi
            done
            pm2 restart all || pm2 restart cctv-backend || pm2 restart backend
            # Ensure Nginx allows up to 50MB uploads
            sudo sed -i '/client_max_body_size/d' /etc/nginx/nginx.conf
            sudo sed -i '/http {/a \    client_max_body_size 50M;' /etc/nginx/nginx.conf
            sudo nginx -t && sudo systemctl reload nginx || true
